default:
  # Number of labeled anomalies in the training set
  n_anomalies: 20

  # Feature transformation when loading dataset: no / l1 / l2 / sc / row
  feat_trans: "no"

  # Multi-feature augmentation config (optional):
  # If enable=true, use augment_node_features() for combined augmentation
  augmentation:
    enable: true
    neighbor:
      enable: true
      type: "bwgnn"   # "sage" or "bwgnn"
      num_layers: 2
      agg: "mean"
      sc: false
    degree:
      enable: true
      log: true
    pagerank:
      enable: true
      alpha: 0.85
      max_iterations: 100
      tol: 0.000001
      log: true
      cache_dir: "pagerank_cache"
    laplacian_pe:
      enable: true
      k: 16
      cache_dir: "lap_pe_cache"
      approx_threshold: 100000
      approx_method: "randomized_svd"

  # Batch size for inference
  batch_size: 2048

